name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Analysis (measurement correctness)
        run: node test/analysis.test.js
      - name: Scoring (plateau, bounds, weights)
        run: node test/scoring.test.js
      - name: Face shape (classification)
        run: node test/faceshape.test.js
      - name: Skin signals + hairline (pixel sampling)
        run: node test/skin.test.js
      - name: Burst aggregation (camera multi-frame)
        run: node test/landmarks-agg.test.js
      - name: Hairstyle library (coverage + barber scripts)
        run: node test/hairstyles.test.js
      - name: Styling (hair plan, quick wins, ethics lint)
        run: node test/styling.test.js
      - name: Recommendations (rules, dedupe, cap)
        run: node test/recommendations.test.js
      - name: Profile (local hair/skin answers)
        run: node test/profile.test.js
      - name: History (local progress storage)
        run: node test/history.test.js
      - name: Deep report (payload + sanitizer)
        run: node test/deepreport.test.js
      - name: Smoke (full pipeline via browser load path)
        run: node test/smoke.test.js
